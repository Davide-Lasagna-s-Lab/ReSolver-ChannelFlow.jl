<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">ReSolverChannelFlow.jl logo</title>
  <desc id="desc">Two Julia-colored velocity profiles between channel walls with the ReSolverChannelFlow.jl wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <linearGradient id="channel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="912" height="232" rx="28" fill="url(#panel)" filter="url(#shadow)"/>

  <g transform="translate(72 54)">
    <rect x="0" y="0" width="286" height="172" rx="18" fill="url(#channel)" stroke="#d7dce6" stroke-width="4"/>

    <g stroke="#2f3441" stroke-width="8" stroke-linecap="round">
      <line x1="24" y1="30" x2="262" y2="30"/>
      <line x1="24" y1="142" x2="262" y2="142"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M62 132 C86 118, 116 100, 146 84" stroke="#389826" stroke-width="10" opacity="0.92"/>
      <path d="M146 84 C172 68, 202 52, 226 40" stroke="#9558b2" stroke-width="10" opacity="0.92"/>
      <path d="M72 132 C150 130, 206 108, 214 82" stroke="#cb3c33" stroke-width="10" opacity="0.92"/>
      <path d="M214 82 C222 54, 164 34, 72 40" stroke="#4063d8" stroke-width="10" opacity="0.92"/>
    </g>
  </g>

  <g transform="translate(398 76)">
    <text x="0" y="48" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#242936" letter-spacing="0">ReSolverChannelFlow.jl</text>
    <text x="2" y="88" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5c6475" letter-spacing="0">plane-channel grids and operators</text>
    <text x="2" y="118" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5c6475" letter-spacing="0">for ReSolver.jl and NSEBase.jl</text>
  </g>
</svg>
